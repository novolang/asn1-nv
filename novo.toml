[package]
name        = "asn1-nv"
version     = "0.1.0"
description = "DER, and enough BER to read what is already deployed: tag-length-value as a feed-and-drain reader with a depth bound, a writer into a caller's buffer, the universal types with OBJECT IDENTIFIER arc arithmetic and times over calendar-nv, and one application module — the PKIX structures the crypto tier parses keys and certificates out of.  No signature verification."
license     = "Apache-2.0"

# `experimental` because no program outside this repository has used the
# package yet.
stability   = "experimental"

# `core`: arithmetic over bytes the caller already holds.  No function
# declares an effect; a certificate arrives as bytes the host read, and
# `not_after` is compared against a time the caller supplies, because a
# `core` package has no clock.
#
# `tests/embedded_probe.nv` builds `asn1tag` for a microcontroller.
# That module reads and writes the identifier and length octets and OID
# arcs as integers, with no buffer and no allocation, which is what a
# device checking a certificate against a key it was provisioned with
# needs.
layer       = "core"

category    = "encoding"

tags = ["asn1", "der", "ber", "x509", "pkcs8", "oid", "certificates", "embedded", "sans-io"]
repository  = "https://github.com/novolang/asn1-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.13.0"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Tag, length, value — and the certificate that is made of them"

[dependencies]
# calendar-nv holds the civil dates UTCTime and GeneralizedTime are read
# into and written from, so the two-digit-year rule is applied here and
# not by every caller.  It is `core`, as this package is.
calendar-nv = "^0.2.0"

# No crypto package is a dependency.  This package reads the structure
# a key or a certificate is written in and stops there: no digest, no
# signature check, no chain building.  `asn1pkix.ec_public_key_point`
# answers the bytes p256-nv's `public_key_from_bytes` takes.
